name: Deploy docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Configure git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install docs dependencies
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --extra docs --python "$(command -v python)"

      - name: Build site (sanity check)
        run: uv run --locked --no-sync mkdocs build

      - name: Deploy to gh-pages
        run: uv run --locked --no-sync mkdocs gh-deploy --force --clean --verbose
