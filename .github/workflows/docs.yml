name: Deploy docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install docs dependencies
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --extra docs --python "$(command -v python)"

      - name: Build site
        run: |
          uv run --locked --no-sync mkdocs build
          touch site/.nojekyll

      - name: Upload built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ALW-44: only the artifact publisher has write authority; no repository code runs here.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Publish the existing gh-pages branch; no Pages settings change.
    steps:
      - name: Download built site
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: docs-site
          path: site
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ github.token }}
          publish_branch: gh-pages
          publish_dir: site
          enable_jekyll: false
