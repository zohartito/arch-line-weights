name: Deploy docs

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # mkdocs gh-deploy pushes the gh-pages branch; nothing else is needed (ALW-44)

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Configure git author
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install docs dependencies
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --extra docs --python "$(command -v python)"

      - name: Build site (sanity check)
        run: uv run --locked --no-sync mkdocs build

      - name: Deploy to gh-pages
        run: uv run --locked --no-sync mkdocs gh-deploy --force --clean --verbose
