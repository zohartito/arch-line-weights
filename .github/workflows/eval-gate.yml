name: eval-gate

# EVENT loop: every push re-runs the deterministic benchmark eval on the
# committed synthetic fixture and posts the score delta vs the committed
# baseline (benchmarks/ci-baseline.json) — on the PR if one exists for the
# branch, otherwise as a commit comment.
#
# ALW-44: the job that installs and runs repository code is read-only. Only the
# comment job holds write permissions, and it neither checks out nor runs code.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gate_exit: ${{ steps.eval.outputs.gate_exit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install uv==0.13.8
          uv sync --locked --python "$(command -v python)"
      - name: Run eval gate
        id: eval
        run: |
          set +e
          uv run --locked --no-sync python scripts/eval_gate.py --report eval-delta.md
          echo "gate_exit=$?" >> "$GITHUB_OUTPUT"
      - name: Publish step summary
        if: always()
        run: cat eval-delta.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Keep report for the comment job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-delta
          path: eval-delta.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Gate
        run: exit "${{ steps.eval.outputs.gate_exit }}"

  comment:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit comments
      pull-requests: write # PR comments
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        continue-on-error: true
        with:
          name: eval-delta
      - name: Comment score delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f eval-delta.md ] || exit 0
          pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number' || true)
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body-file eval-delta.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
              -f body="$(cat eval-delta.md)" --silent
          fi
